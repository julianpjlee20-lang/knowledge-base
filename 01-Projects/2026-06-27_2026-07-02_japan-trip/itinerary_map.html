      {id:'fit24-joto-furuichi', type:'gym', status:'needs_check', date:'不建議作為飯店附近選項', name:'FiT24 城東古市店', brands:'FiT24 官方大阪府店鋪；最近但距難波飯店仍偏遠', buy:'用途：若堅持 FiT24 可查 1day ticket / visitor 使用；不適合當作飯店附近步行健身房。', lat:34.707272, lon:135.560021, walk:'從 RITA HOTEL NAMBA 路線約 12.68 km / 159 分；不建議步行', addr:'大阪府大阪市城東区古市1丁目21-25', hours:'FiT24 店鋪通常 24h；1day ticket / 外國旅客使用條件需出發前確認', source:'FiT24 官方 shopinfo.xml / 店鋪頁'},
      {id:'fit24-suita-kishibe', type:'gym', status:'needs_check', date:'不建議作為飯店附近選項', name:'FiT24 吹田岸部店', brands:'FiT24 官方大阪府店鋪；比城東古市更遠', buy:'用途：僅作官方大阪 FiT24 備查；不適合難波住宿附近健身。', lat:34.785971, lon:135.535902, walk:'從 RITA HOTEL NAMBA 路線約 18.47 km / 231 分；不建議步行', addr:'大阪府吹田市岸部北5丁目18-9 2F', hours:'FiT24 店鋪通常 24h；1day ticket / 外國旅客使用條件需出發前確認', source:'FiT24 官方 shopinfo.xml / 店鋪頁'}
    ];

    const map = L.map('map').setView([origin.lat, origin.lon], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    function color(p){
      if (p.status === 'selected') return '#111827';
      if (p.status === 'excluded') return '#9e9e9e';
      if (p.status === 'needs_check') return '#ff7f0e';
      return {hotel:'#d62728', shopping:'#1f77b4', food:'#2ca02c', sight:'#9467bd', gym:'#17becf'}[p.type] || '#7f7f7f';
    }
    function gmapsRoute(lat, lon){ return `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lon}&destination=${lat},${lon}&travelmode=walking`; }
    function gmapsSearch(name){ return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`; }
    const layerById = new Map();
    const bounds = [];
    for (const p of places) {
      const marker = L.circleMarker([p.lat, p.lon], {radius:p.type==='hotel'?9:8, color:color(p), fillColor:color(p), fillOpacity:.88, weight:2}).addTo(map);
      const warn = p.status === 'needs_check' ? '<p class="warn">⚠ 營業時間未確認 / 営業時間未確認，不可直接排固定時間</p>' : '';
      const buy = p.buy ? `<p><b>買什麼 / 買うもの：</b>${p.buy}</p>` : '';
      marker.bindPopup(`<div class="popup"><h3>${p.name}</h3><span class="tag">${p.date || '未定日期'}</span><span class="tag">${p.type}</span><p><b>內容 / 内容：</b>${p.brands}</p>${buy}<p><b>距離 / 距離：</b>${p.walk}</p><p><b>地址 / 住所：</b>${p.addr}</p><p><b>營業 / 営業：</b>${p.hours}</p>${warn}<p><b>來源 / 出典：</b>${p.source}</p><a target="_blank" href="${gmapsRoute(p.lat,p.lon)}">從難波住宿步行導航</a>　<a target="_blank" href="${gmapsSearch(p.name)}">Google Maps 搜尋</a></div>`);
      layerById.set(p.id, {marker, place:p});
      bounds.push([p.lat, p.lon]);
    }
    map.fitBounds(bounds, {padding:[40,40]});

    function applyFilter(filter) {
      for (const {marker, place} of layerById.values()) {
        const show = filter === 'all' || place.type === filter || (filter === 'needs_check' && place.status === 'needs_check');
        if (show) marker.addTo(map); else marker.removeFrom(map);
      }
    }
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(btn.dataset.filter);
      });
    });
  </script>
